<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Report</title>
<link rel="stylesheet" href="css/style.css?v=20260828" />
</head>
<body>
  <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
  <div class="mobile-backdrop" id="mobileBackdrop"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="auth-logo">
        <div class="mark">DR</div>
        <div>
          <div class="name" data-i18n="appName">Daily Report</div>
          <div class="tag" data-i18n="appTagline">Quy trình hiện trường</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item" data-view="overview"><span class="nav-icon">▦</span><span data-i18n="overview">Tổng quan</span></button>
        <button class="nav-item" data-view="projects"><span class="nav-icon">▤</span><span data-i18n="currentProjects">Dự án hiện tại</span></button>
        <button class="nav-item" data-view="report"><span class="nav-icon">▧</span><span data-i18n="dailyReport">Báo cáo ngày</span></button>
        <button class="nav-item" data-view="drilllog"><span class="nav-icon"><svg class="drill-icon" viewBox="0 0 24 24" fill="none" stroke="url(#drillIconGradSidebar)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><linearGradient id="drillIconGradSidebar" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:var(--accent-red)" /><stop offset="50%" style="stop-color:var(--accent)" /><stop offset="100%" style="stop-color:var(--accent-2)" /></linearGradient></defs><rect x="10" y="2" width="4" height="2.6" rx="0.5"/><path d="M10.2 4.6 L9.4 14.5"/><path d="M13.8 4.6 L14.6 14.5"/><path d="M9.4 14.5 L12 21 L14.6 14.5"/><path d="M9.9 8 L14.1 8"/><path d="M9.65 11.2 L14.35 11.2"/></svg></span><span data-i18n="drillLog">Nhật ký máy khoan</span></button>
        <button class="nav-item" data-view="equipment"><span class="nav-icon">📦</span><span data-i18n="equipmentTitle">Xuất/Nhập thiết bị</span></button>
        <button class="nav-item" data-view="materials"><span class="nav-icon">🏷️</span><span data-i18n="materialsTitle">Bảng giá vật tư</span></button>
        <button class="nav-item" data-view="activity"><span class="nav-icon">◷</span><span data-i18n="activityLog">Nhật ký</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span data-i18n="settings">Cài đặt</span></button>
      </nav>

      <div class="sidebar-user">
        <div class="avatar" id="userAvatar">?</div>
        <div class="who">
          <div class="name" id="userNameLabel">—</div>
          <div class="role" id="userRoleLabel">—</div>
        </div>
      </div>
      <button class="logout-link" id="logoutBtn" data-i18n="logout">Đăng xuất</button>
    </aside>

    <main class="main" id="mainView">
      <div class="empty-state">Loading…</div>
    </main>
  </div>

  <div class="save-indicator hidden" id="saveIndicator">
    <span class="save-dot"></span>
    <span id="saveIndicatorText">—</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
